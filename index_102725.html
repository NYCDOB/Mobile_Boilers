/* The switch - the box around the slider */
.switch {
  position: relative;
  display: inline-block;
  width: 32px;
  height: 20px;
}

/* Hide default HTML checkbox */
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

/* The slider */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  -webkit-transition: .4s;
  transition: .4s;
}

.slider:before {
  position: absolute;
  content: "";
  height: 12px;
  width: 12px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  -webkit-transition: .4s;
  transition: .4s;
}

<script>

$(document).ready(function(){

	var yyyy = today.getFullYear();
	today = mm + '/' + dd + '/' + yyyy;

	var latlong = [];

      _refocusOnMap: L.Util.falseFn // Do nothing.
    });	
var map = L.map('map').setView([40.713653874056504, -73.99620617472422], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions">CARTO</a>'}).addTo(map);
var tooltip = d3.select('#map').append('div')
	.attr('class', 'tooltip');
var width = $("#map").width(),
	height = $("#map").height(),
	points = [],
	table_map = [],
	filteredData,
	latLngs = [];	
    let _lObj={"BIN":"BIN","Address":"Address","Borough":"BOROUGH","CD":"CD","Status":"Status","Community District":"CD","Item Type Name":"ItemTypeName","JFNPermitNumber":"JFNPermitNumber","Filing Number":"FilingNumber","Created On Date":"CreatedOnDate","Work Type Name":"WorkTypeName","Filing Type Name":"FilingTypeName","Permit Expires On":"PermitExpiresOn",};
	var pointsOverlay = L.d3SvgOverlay(function(sel,proj){
	var pointsUpd = sel.selectAll('circle').data(points);	

	pointsUpd.enter()
		.append('circle')		
		.attr("bin",function(d){return d.BIN})
		.attr('cx',function(d){return proj.latLngToLayerPoint(d.latLng).x;})
		.attr('cy',function(d){return proj.latLngToLayerPoint(d.latLng).y;})
		.attr('class', function(d){
			//return "point";
				switch(d.ItemTypeName){
					case 'Registered gas fired temporary boiler':
						return 'pointGas';
						break;
					case 'Temporary DOB registered oil fired mobile boiler':
						return 'pointOil';
						break;
					case 'Temporary Oil Tank (above ground)':
						return 'pointOilAbove';
						break; 
				}
		})
		.on('click', function(d){		
				tooltip.html(dit(d["LAT"].concat(d["LONG"]),1));
					tooltip.style("visibility", "visible");	
			}
		)
		.on("mouseover", function(d, i){
			$(this).attr("style", "cursor: pointer; fill: #eef442; fill-opacity: 1;");			
		})
		.on("mouseout", function(d, i){			
			$(this).attr("style", "stroke-width: 0px; fill-opacity: .7;");
		});
		pointsUpd.attr('r', 6 / proj.scale);
		
			var gasSlider = document.querySelector('input[id="chkGas"]');
				oilSlider = document.querySelector('input[id="chkOil"]');
				oilAboveSlider = document.querySelector('input[id="chkOilAbove"]');
				
				gasSlider.onchange = function(){
						if(this.checked){
							d3.selectAll(".pointGas").filter(function(d) {
								return d.ItemTypeName == "Registered gas fired temporary boiler";
							})
							.style("display", "block");	

						} else {
							d3.selectAll(".pointGas").filter(function(d) {
								return d.ItemTypeName == "Registered gas fired temporary boiler";
							})
							.style("display", "none");
										
						}
				};		
				
				oilSlider.onchange = function(){
						if(this.checked){
							d3.selectAll(".pointOil").filter(function(d) {
								return d.ItemTypeName == "Temporary DOB registered oil fired mobile boiler";
							})
							.style("display", "block");	

						} else {
							d3.selectAll(".pointOil").filter(function(d) {
								return d.ItemTypeName == "Temporary DOB registered oil fired mobile boiler";
							})
							.style("display", "none");
										
						}
				};

				oilAboveSlider.onchange = function(){
						if(this.checked){
							d3.selectAll(".pointOilAbove").filter(function(d) {
								return d.ItemTypeName == "Temporary Oil Tank (above ground)";
							})
							.style("display", "block");	

						} else {
							d3.selectAll(".pointOilAbove").filter(function(d) {
								return d.ItemTypeName == "Temporary Oil Tank (above ground)";
							})
							.style("display", "none");
										
						}
				};
		
		
		
		
		
		
		
	});
    const dit=(_pl,...args)=>{
		if (!_pl) {tooltip.style("visibility","hidden");console.error("Invalid key");return ""};
		if (!args[0] && !_pl.target.className.match(/_pr|_nx|_cl/)) {return};
		let _dX=0;
		let _l=[];
		let doString = (_sObject,_dX, _l)=>{
			let _xx='';
			for (let [k,v] of Object.entries(_sObject) ) {
				let _str=()=>
				{if (v.includes('BIN')) {
					return `<a target="_blank" href=http://a810-bisweb.nyc.gov/bisweb/PropertyProfileOverviewServlet?bin=${_l[_dX][v]}&go4=+GO+&requestid=0>${_l[_dX][v]}</a>`
				}}
				_xx+=`<div class="_fM3_0"><div>${k}:</div><div>${_str()||_l[_dX][`${v}`]}</div></div>`;
			};
			let truncor = _l[_dX]["LAT"].concat(_l[_dX]["LONG"]);
			return `<div class="_tD"><div class="_nav">${_dX+1} of ${_l.length}</div><div><span class="_pr" title="Previous">&#11207;</span><span class="_nx" title="Next">&#11208;</span></div><div style="font-size:17px;" title="Close" class="material-symbols-outlined _cl">close</div></div><div class="_cycleD"><span class="_cor">${truncor}</span>${_xx}</div>`;
			}
			let _sortD=(_ID) => {
				return points.filter(_p=> _p["LAT"].concat(_p["LONG"]) ==_ID);
			}
			let _clr=()=>{
			tooltip.style("visibility", "hidden");document.querySelector(".tooltip").innerHTML="";
			document.querySelector(".tooltip").removeEventListener("click",dit);
		}
		if (!args[0]){
			if (_pl.target.classList.contains("_cl")) {
				_clr();return;
			}
			if (document.querySelector("._nav").textContent=="1 of 1"||(_pl.target.className!="_pr" && _pl.target.className!="_nx")){return};
			let _key=document.querySelector("._cor").innerText;
			_l=_sortD(_key);  if (!_l[0])   {_clr();console.error("Invalid key");return ""};
			let _sN =parseInt(document.querySelector("._nav").textContent?.match(/(.*?) /));
			if (!_sN| _sN<1||_sN>_l.length){_clr();console.error("Invalid key");return ""};
			if (_pl.target.className=="_pr") {
				if(_sN==1){_dX=_l.length-1} else {_dX=_sN-2;}
			}
			if (_pl.target.className=="_nx") {
				if(_sN==_l.length){_dX=0} else {_dX=_sN;}
			};
			document.querySelector(".tooltip").innerHTML=doString(_lObj,_dX,_l);
		} else {
			_l=_sortD(_pl); 
			if (!_l[0]) {_clr();console.error("Invalid key");return ""};
			document.querySelector(".tooltip").removeEventListener("click",dit); 
			document.querySelector(".tooltip").addEventListener("click",dit);
			return doString(_lObj,_dX,_l);
		};
    }
	d3.csv("https://raw.githubusercontent.com/NYCDOB/Mobile_Boilers/gh-pages/data/MobileBoiler_102725.csv",function(data){
	//d3.csv("data/MobileBoiler_102725.csv",function(data){
				points = data.map(function(d){
				d.latLng = [+d.LAT,+d.LONG];
				d.bin = d.BIN;
				d.ItemTypeName = d.ItemTypeName;
				d.JFNPermitNumber = d.JFNPermitNumber;
				d.FilingNumber = d.FilingNumber;
				d.CreatedOnDate = d.CreatedOnDate;
				d.WorkTypeName = d.WorkTypeName;
				d.FilingTypeName = d.FilingTypeName;
				d.Address = d.Address;
				d.CD = d.CD;
				d.BOROUGH = d.BOROUGH;
				d.PermitExpiresOn = d.PermitExpiresOn;
				d.Status = d.Status;
			return d;
			});
		pointsOverlay.addTo(map);
	});
	function highlightPoint(layerID){
		document.querySelectorAll("circle[class*='zoom']").forEach(_z=>_z.classList.remove("zoomedPoint"));
		let _z=document.querySelector("circle[bin='"+layerID+"']");
		if (!!_z){
			document.querySelectorAll("circle[cx='"+ _z.getAttribute('cx')+"'][cy='"+_z.getAttribute('cy')+"']").forEach(_p=>_p.classList.add('zoomedPoint'));
		}
	}
	function zoomToSelectedCATHY(lat,lon){
		// map.panTo(new L.LatLng(lat,lon));
		map.panTo(new L.LatLng(lat,lon));
	}
	function zoomToSelected(latlong){
			map.setView(latlong,17);
	}	
	function zoomFullExtent(){
		map.setView([40.713653874056504, -73.99620617472422], 11);
        document.querySelectorAll(".zoomedPoint").forEach(_p=>_p.classList.remove('zoomedPoint')); 
	}
	map.on('resize', function(){
		map.invalidateSize();		
	});
	function format ( d ) {
		return '<table cellpadding="5" cellspacing="0" border="0" style="padding-left:50px;">'+
			'<tr>'+
				'<td>BIN:</td>'+
				'<td>'+'<a href= "http://a810-bisweb.nyc.gov/bisweb/PropertyProfileOverviewServlet?bin=' + [d.BIN] + '&go4=+GO+&requestid=0" target="_blank">' + [d.BIN] + '</a>'+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Address:</td>'+
				'<td>'+[d.Address]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Borough:</td>'+
				'<td>'+[d.BOROUGH]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Community District:</td>'+
				'<td>'+[d.CD]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Item Type Name:</td>'+
				'<td>'+[d.ItemTypeName]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>JFNPermitNumber:</td>'+
				'<td>'+[d.JFNPermitNumber]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Filing Number:</td>'+
				'<td>'+[d.FilingNumber]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Created On Date:</td>'+
				'<td>'+[d.CreatedOnDate]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Work Type Name:</td>'+
				'<td>'+[d.WorkTypeName]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Filing Type Name:</td>'+
				'<td>'+[d.FilingTypeName]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Permit Expires On:</td>'+
				'<td>'+[d.PermitExpiresOn]+'</td>'+
			'</tr>'+
			'<tr>'+
				'<td>Status:</td>'+
				'<td>'+[d.Status]+'</td>'+
			'</tr>'+
			
		'</table>';
	}	
	function zoom(lat,lon){
		map.panTo(new L.LatLng(lat,lon));
	}	
	$(function(){
		var table = $('#riskTable').DataTable({
				"ajax": {
					"url": "https://raw.githubusercontent.com/NYCDOB/Mobile_Boilers/gh-pages/data/MobileBoiler_102725.json",
					//"url": "data/MobileBoiler_102725.json",
					"dataSrc": ""
				},
				order: [[2, "asc"],[1, "asc"]],
				lengthChange: false,
				"scrollY": "70vh",
				"scrollCollapse": true,
				"paging": false,
				columns: [
					{
						"className": 'details-control',
						"orderable": false,
						"data": null,
						"defaultContent": ''
					},
					{	data: "Address"
					},
					{ 	data: "BOROUGH" 
					}
				]

			});
            $('#riskTable tbody').on( 'click', 'tr :not(td.details-control)', function (e) {
			theParent=this.parentNode;
			if (!theParent.hasAttribute("role")  ) {
				return; 
			}			
			if ( theParent.classList.contains("selected") ) {  
				theParent.classList.remove('selected');			
				zoomFullExtent();
			} else {
				j2=document.querySelectorAll(".selected");
				for(j=0;j<j2.length;j++) {
					j2[j].classList.remove("selected");
				}
				$(theParent).addClass('selected');
				highlightPoint(table.row(this).data().BIN);	
				let mylatlong=[table.row(this).data().LAT,table.row(this).data().LONG]
				zoomToSelected(mylatlong);
			}
		});
		$('#riskTable tbody').on('click', 'td.details-control', function (e) {
			var tr = $(this).closest('tr');
			var row = table.row( tr );
			if ( row.child.isShown() ) {
				row.child.hide();
				tr.removeClass('shown');
			}
			else {
				row.child( format(row.data()) ).show();
				tr.addClass('shown');
			}
		});	
	});		
});	
</script>
</body>
</html>
